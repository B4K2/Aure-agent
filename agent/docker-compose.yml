# Aura's memory stores. The VOID site + its Postgres live in ../test-website/docker-compose.yml.
services:
  qdrant:
    image: qdrant/qdrant
    ports: ["6333:6333", "6334:6334"]
    volumes: [./qdrant_storage:/qdrant/storage]
  neo4j:
    image: neo4j:5
    ports: ["7474:7474", "7687:7687"]
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-aura-dev-password}
    volumes: [./neo4j_data:/data]

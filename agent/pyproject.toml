[project]
name = "aura-agent"
version = "0.1.0"
description = "Aura agentic SRE: LangGraph pipeline watching the VOID demo site"
requires-python = ">=3.12"
dependencies = [
    "langgraph>=0.6",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "openai>=1.50",
    "pydantic>=2.8",
    "python-dotenv>=1.0",
    "qdrant-client>=1.12",
    "neo4j>=5.24",
    "psycopg[binary]>=3.2",
    "sentence-transformers[image]>=5.1",
    "transformers>=4.57",
    "torch>=2.7",
    "torchvision",
    "typer>=0.12",
    "rich>=13",
]

[project.scripts]
aura = "cli.aura:app"

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aura", "cli"]

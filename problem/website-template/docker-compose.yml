services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: void
      POSTGRES_PASSWORD: void
      POSTGRES_DB: void
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U void -d void"]
      interval: 2s
      timeout: 3s
      retries: 20

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 4000
      DATABASE_URL: postgres://void:void@db:5432/void
      JWT_SECRET: dev-secret-change-me
    ports:
      - "4000:4000"
    profiles: ["app"]

volumes:
  pgdata:

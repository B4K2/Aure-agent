# VOID shop on Kubernetes: Postgres (StatefulSet) + the app (Deployment). Applied by k8s/up.sh.
# NodePorts let the injector, the virtual users and an Aura agent outside the cluster reach both:
#   app  http://localhost:30400      db  postgres://void:void@localhost:30433/void
apiVersion: v1
kind: Namespace
metadata:
  name: void
---
apiVersion: v1
kind: Service
metadata:
  name: void-db
  namespace: void
spec:
  type: NodePort
  selector: { app: void-db }
  ports:
    - { port: 5432, targetPort: 5432, nodePort: 30433 }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: void-db
  namespace: void
spec:
  serviceName: void-db
  replicas: 1
  selector:
    matchLabels: { app: void-db }
  template:
    metadata:
      labels: { app: void-db }
    spec:
      containers:
        - name: postgres
          image: postgres:17-alpine
          env:
            - { name: POSTGRES_USER, value: void }
            - { name: POSTGRES_PASSWORD, value: void }
            - { name: POSTGRES_DB, value: void }
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
          ports:
            - containerPort: 5432
          readinessProbe:
            exec: { command: ["pg_isready", "-U", "void", "-d", "void"] }
            periodSeconds: 2
          volumeMounts:
            - { name: pgdata, mountPath: /var/lib/postgresql/data }
  volumeClaimTemplates:
    - metadata:
        name: pgdata
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests: { storage: 2Gi }
---
apiVersion: v1
kind: Service
metadata:
  name: void-app
  namespace: void
spec:
  type: NodePort
  selector: { app: void-app }
  ports:
    - { port: 4000, targetPort: 4000, nodePort: 30400 }
---
# One replica on purpose: Aura reads /metrics through the Service, and counters from several pods
# behind one URL would look like constant restarts. Rolling update with a readiness probe, so a deploy
# that never becomes ready stalls with the old pod still serving (Kubernetes does not roll it back).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: void-app
  namespace: void
spec:
  replicas: 1
  revisionHistoryLimit: 20
  progressDeadlineSeconds: 120
  strategy:
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  selector:
    matchLabels: { app: void-app }
  template:
    metadata:
      labels: { app: void-app }
    spec:
      containers:
        - name: app
          image: void-app:latest  # k8s/up.sh applies this with void-app:<commit>; deploys roll it forward
          imagePullPolicy: Never
          env:
            - { name: PORT, value: "4000" }
            - { name: DATABASE_URL, value: postgres://void:void@void-db:5432/void }
            - { name: JWT_SECRET, value: dev-secret-change-me }
          ports:
            - containerPort: 4000
          readinessProbe:
            httpGet: { path: /api/health, port: 4000 }
            periodSeconds: 3
            failureThreshold: 2
          resources:
            limits: { memory: 1Gi }
